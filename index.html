<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý Công tác Cá nhân</title>
<meta name="description" content="Phần mềm quản lý công tác cá nhân của cán bộ, công chức — Ban Tuyên giáo Tỉnh ủy Tuyên Quang">
<meta name="theme-color" content="#C8102E">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Màn hình thiết lập kết nối (chỉ hiện khi js/config.js chưa điền) -->
<div id="setup" class="auth hidden">
  <form class="auth-card" id="setupForm">
    <img src="assets/logo.png" alt="Logo" class="auth-logo">
    <h1>Thiết lập kết nối</h1>
    <p class="muted">Nhập thông tin dự án Supabase (Project Settings → API). Chỉ cần làm một lần trên mỗi thiết bị.</p>
    <label>Project URL<input id="setUrl" placeholder="https://xxxx.supabase.co" required></label>
    <label>anon public key<input id="setKey" placeholder="eyJhbGciOi..." required></label>
    <button class="btn primary" type="submit">Lưu và tiếp tục</button>
  </form>
</div>

<!-- Đăng nhập -->
<div id="login" class="auth hidden">
  <form class="auth-card" id="loginForm">
    <img src="assets/logo.png" alt="Logo Ban Tuyên giáo" class="auth-logo">
    <h1>Quản lý Công tác Cá nhân</h1>
    <p class="muted">Ban Tuyên giáo Tỉnh ủy Tuyên Quang</p>
    <label>Email<input id="lgEmail" type="email" autocomplete="username" required></label>
    <label>Mật khẩu<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <div id="lgErr" class="form-err" role="alert"></div>
    <button class="btn primary" type="submit" id="lgBtn">Đăng nhập</button>
    <a href="#" id="resetConn" class="tiny-link">Đổi dự án kết nối</a>
  </form>
</div>

<!-- Ứng dụng -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Mở menu"></button>
    <img src="assets/logo.png" alt="" class="tb-logo"><span class="tb-title" id="tbTitle">Tổng quan</span>
  </header>
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="Logo Ban Tuyên giáo">
      <div><b>Quản lý Công tác</b><span>Cá nhân</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="usercard">
      <div class="avatar" id="uAvatar">?</div>
      <div class="u-text"><b id="uName"></b><span id="uRole"></span></div>
      <button class="icon-btn light" id="logoutBtn" title="Đăng xuất" aria-label="Đăng xuất"></button>
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>

<dialog id="taskDlg"></dialog>
<dialog id="msgDlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="busy" class="busy hidden"><div class="spin"></div></div>

<script src="vendor/supabase.min.js"></script>
<script src="vendor/docx.min.js"></script>
<script src="vendor/exceljs.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
